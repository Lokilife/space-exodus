- type: entity
  parent: IDCardStandard
  id: BlueshieldOfficierIDCard
  name: blueshield officier ID card
  components:
  - type: Sprite
    layers:
    - state: silver
    - state: stripe_bottom
      color: &color-blueshield-bottom "#1b67a5"
    - sprite: &icon-rsi Interface/Misc/job_icons.rsi
      offset: &icon-offset -0.09375, 0.0625 #3 pixels left, 2 pixels up
      state: BlueshieldOfficer
  - type: PresetIdCard
    job: BlueshieldOfficer

- type: entity
  parent: IDCardStandard
  id: IDCardDSCommander
  name: death squad commander ID card
  components:
  - type: PresetIdCard
    job: DSCommander
  - type: Sprite
    layers:
    - state: black
    - state: stripe_top
      color: &color-medical-top "#68aed6"
    - state: stripe_bottom
      color: &color-medical-bottom "#325f7a"
    - sprite: *icon-rsi
      offset: *icon-offset
      state: DeathSquad

- type: entity
  parent: IDCardDSCommander
  id: IDCardDSOfficer
  name: death squad Officer ID card
  components:
  - type: PresetIdCard
    job: DSOfficer

- type: entity
  parent: IDCardDSCommander
  id: IDCardDSSpecialist
  name: death squad specialist ID card
  components:
  - type: PresetIdCard
    job: DSSpecialist
