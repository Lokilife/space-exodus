- type: entity
  id: MechanicalInjector
  parent: BaseSyringe
  name: mechanical injector
  description: A special injector for races with thick skin. Intimidating enough to make your patient more careful. Please don't use it to intimidate the crew.
  components:
    - type: Injector
      toggleState: Draw
    - type: InjectorEffects
      afterInjection:
      - !type:Emote
        conditions:
        - !type:TagCondition
          tag: ThickSkin
          inverted: true
        - !type:IsMobCondition
        emote: Scream
        showInChat: true
      - !type:HealthChange
        conditions:
        - !type:TagCondition
          tag: ThickSkin
          invert: true
        - !type:IsMobCondition
        damage:
          types:
            Piercing: 10
      - !type:ModifyBleed
        conditions:
        - !type:TagCondition
          tag: ThickSkin
          invert: true
        - !type:IsMobCondition
        amount: 5
      - !type:PopupMessage
        conditions:
        - !type:TagCondition
          tag: ThickSkin
          invert: true
        - !type:IsMobCondition
        visualType: MediumCaution
        messages: ["mechanical-injector-effect-pain-message"]
    - type: Sprite
      sprite: Exodus/Objects/Specific/Medical/mechanical_injector.rsi
      layers:
        - state: icon
          map: ["enum.SolutionContainerLayers.Base"]
        - state: syringe1
          map: ["enum.SolutionContainerLayers.Fill"]
          visible: false
    - type: SolutionContainerVisuals
      maxFillLevels: 2
      fillBaseName: syringe
      inHandsMaxFillLevels: 0
    - type: Icon
      sprite: Exodus/Objects/Specific/Medical/mechanical_injector.rsi
      state: icon
    - type: Item
      size: Small
      sprite: Exodus/Objects/Specific/Medical/mechanical_injector.rsi
    - type: Tag
      tags:
        - Syringe
        - ThickSyringe

#region Prefilled
- type: entity
  parent: MechanicalInjector
  id: PrefilledMechanicalInjector
  abstract: true
  components:
  - type: Injector
    toggleState: Inject

- type: entity
  suffix: epinephrine
  parent: PrefilledMechanicalInjector
  id: MechanicalInjectorEpinephrine
  components:
  - type: Label
    currentLabel: reagent-name-epinephrine
  - type: SolutionContainerManager
    solutions:
      injector:
        maxVol: 15
        reagents:
        - ReagentId: Epinephrine
          Quantity: 10
        - ReagentId: TranexamicAcid
          Quantity: 5
